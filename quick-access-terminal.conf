# Hide the window when it loses focus (optional, set to 'yes' for auto-hide)
hide_on_focus_loss yes

# Grab keyboard input to prevent typing in other windows
grab_keyboard yes

# Adjust margins for a "Quake-like" centered or edge-docked look
margin_left 20
margin_right 20
margin_top 10
margin_bottom 10

# Set the number of lines in the terminal (e.g., 20 lines)
lines 20

# Adjust font size specifically for the quick access window
kitty_override font_size 13

# Set background opacity (0.0 to 1.0)
opacity 0.9

# Set a unique app ID for window management
app_id kitty-quick-access   
